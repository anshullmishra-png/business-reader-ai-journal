<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send to Journal: settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 440px; padding: 20px; }
    label { display: block; margin: 16px 0 6px; font: 11px Consolas, monospace; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
    input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--border); background: transparent; color: var(--text); font: 13px Consolas, monospace; }
    input:focus { outline: 1px solid var(--text); border-color: var(--text); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .btn { margin-top: 18px; }
  </style>
</head>
<body>
  <header class="top">
    <img src="icons/icon-32.png" width="24" height="24" alt="">
    <span class="brand">Send to Journal: settings</span>
  </header>
  <form id="form">
    <label for="token">Capture token</label>
    <input id="token" autocomplete="off" spellcheck="false" required>
    <p class="hint">Copy it from the journal: Account → Settings → Browser extension.</p>

    <label for="server">Journal address</label>
    <input id="server" spellcheck="false" placeholder="https://business-reads-journal.vercel.app">
    <p class="hint">The web address of your journal. Leave it as is unless you were given a different one.</p>

    <button class="btn" type="submit">Save</button>
    <p class="ok" id="saved" hidden style="margin-top:12px">Saved ✓</p>
  </form>
  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
